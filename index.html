<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UOB IT PMO — Project Kanban</title>

<!--
  ============================================================================
  UOB IT PMO — Internal demo / training tool.

  This is NOT an official UOB system. No UOB logo, trademark or branding is
  used; "UOB IT PMO" appears only as a neutral text wordmark.

  Runs by double-clicking this file. No server, no build step, no framework,
  no external resource of any kind.

  NO PERSISTENCE: board state lives in a JavaScript array in memory only.
  Refreshing the page resets the board to the seeded demo data, by design.
  ============================================================================
-->

<style>
/* ===========================================================================
   1. TOKENS
   ---------------------------------------------------------------------------
   Direction: "delivery control" - a change-control status sheet, not a
   productivity app. Flat surfaces, no shadows; depth comes from value
   contrast. Radius encodes role rather than being one value on everything.
   =========================================================================== */
:root {
  /* Base */
  --ink:        #0e1a2b;   /* authority: header ground, primary type */
  --ink-2:      #1b2c44;   /* raised ink, for bands within the header */
  --paper:      #dfe4ec;   /* the board sheet */
  --surface:    #ffffff;   /* card face */
  --rule:       #d5dce6;   /* structure */
  --rule-soft:  #e6ebf1;
  --quiet:      #5b6875;   /* secondary type */
  --quieter:    #808c99;

  /* Signal set - severity is content, not decoration.
     Deliberately grave: a bank's P1 is not a cheerful red. */
  --p1:    #a4262c;
  --p1-bg: #fbecec;
  --p2:    #9a5b00;
  --p2-bg: #fbf1e3;
  --p3:    #1b5fc1;
  --p3-bg: #e9f0fb;
  --p4:    #6b7684;
  --p4-bg: #eef1f4;
  --done:    #0b6b45;
  --done-bg: #e7f3ed;

  /* Column identity. Each status owns a hue, so a glance at the board reads
     as a shape of colour before a single word is read. Saturation tracks
     urgency: blocked is hottest, done is coolest and lowest. */
  --col-backlog:      #475569;
  --col-backlog-wash: #e2e7ef;
  --col-active:       #1d4ed8;
  --col-active-wash:  #dbe6fb;
  --col-blocked:      #b02a2a;
  --col-blocked-wash: #f8dede;
  --col-done:         #15734c;
  --col-done-wash:    #dcebe3;

  /* Shadows are tinted with the surface's own hue rather than neutral grey,
     and layered so the falloff reads as light, not a blur stamp. */
  --lift-1: 0 1px 1px rgba(18, 32, 54, .05), 0 2px 4px rgba(18, 32, 54, .06);
  --lift-2: 0 2px 4px rgba(18, 32, 54, .07), 0 8px 18px rgba(18, 32, 54, .10);
  --lift-head: 0 1px 0 rgba(255,255,255,.14) inset, 0 6px 16px rgba(10, 20, 36, .18);

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 36px;

  /* Radius encodes role: panels read as structure, controls as interactive */
  --r-panel:   3px;
  --r-card:    2px;
  --r-control: 6px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans", sans-serif;
}

/* ===========================================================================
   2. BASE
   =========================================================================== */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* Numerals align in columns - IDs, dates and counts are all data */
.task-id, .count, .datum b, .card-due, .move-select { font-variant-numeric: tabular-nums; }

:focus-visible {
  outline: 2px solid var(--p3);
  outline-offset: 2px;
  border-radius: 2px;
}

.app-header :focus-visible { outline-color: #8fb6f2; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ===========================================================================
   3. HEADER - identity band, then the risk datum line
   =========================================================================== */
.app-header {
  background:
    radial-gradient(120% 140% at 88% -30%, rgba(63, 114, 196, .40) 0%, rgba(63, 114, 196, 0) 58%),
    linear-gradient(168deg, #17263d 0%, var(--ink) 52%, #0a1422 100%);
  color: #fff;
  padding: var(--space-5) var(--space-5) 0;
  border-bottom: 3px solid #0a1422;
}

.header-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-4);
  padding-bottom: var(--space-5);
}

.wordmark { display: flex; align-items: center; gap: var(--space-3); margin-right: auto; }

.wordmark-glyph {
  display: grid; place-items: center;
  width: 26px; height: 26px;
  flex: none;
  color: #9fc0f0;
}

.wordmark-text { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.wordmark-text strong { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.wordmark-text span { font-size: 13px; color: #9aa8bb; }

/* --- the risk datum line: the one place this design raises its voice ------ */
.summary {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 1px;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.12);
  border-bottom: none;
  border-radius: var(--r-panel) var(--r-panel) 0 0;
  overflow: hidden;
  box-shadow: var(--lift-head);
}

.datum {
  background: linear-gradient(180deg, #23374f 0%, var(--ink-2) 100%);
  padding: var(--space-3) var(--space-4);
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  font-size: 12px;
  color: #9aa8bb;
  flex: 0 0 auto;
  white-space: nowrap;
}
.datum b { font-size: 19px; font-weight: 700; color: #fff; line-height: 1.1; }

.datum-total { border-right: 1px solid rgba(255,255,255,.12); }
.datum-total b { font-size: 24px; }

/* The alert sits hard right, away from the routine counts */
.summary .datum:last-child { margin-left: auto; }

/* Done recedes even here - finished work is archive, not active risk */
.datum-done b { color: #9aa8bb; }

.datum-alert {
  background: linear-gradient(180deg, #c33 0%, var(--p1) 100%);
  color: #fadcdc;
  box-shadow: 0 0 0 1px rgba(255,140,140,.35) inset;
}
.datum-alert b { color: #fff; font-size: 24px; }
.datum-clear b { color: #8fd3b4; }

.demo-note {
  margin: 0;
  padding: var(--space-3) 0 var(--space-4);
  font-size: 12px;
  color: #8896a8;
  max-width: 78ch;
}

/* ===========================================================================
   4. FILTERS - quiet by design; it is a tool, not a feature
   =========================================================================== */
.filters {
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: var(--space-4) var(--space-5);
  box-shadow: var(--lift-1);
  position: relative;
  z-index: 1;
}

.filters-inner { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-4); }

.field { display: flex; flex-direction: column; gap: var(--space-1); }
.field > label { font-size: 12px; font-weight: 600; color: var(--quiet); }

.control {
  border: 1px solid var(--rule);
  border-radius: var(--r-control);
  padding: 7px var(--space-3);
  background: var(--surface);
  min-width: 190px;
  color: var(--ink);
}
.control:hover { border-color: var(--quieter); }
.control::placeholder { color: var(--quieter); }

.filter-status { margin: 0 0 6px auto; font-size: 12px; color: var(--quiet); }

/* ===========================================================================
   5. BOARD
   =========================================================================== */
.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-4);
  padding: var(--space-5);
  align-items: start;
}

.column {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-panel);
  display: flex;
  flex-direction: column;
  min-height: 200px;
  overflow: hidden;
  box-shadow: var(--lift-1);
}

/* Each column header is a solid band in that status's hue, so the board
   reads as a shape of colour before a word is read. */
.column-header {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--col-backlog);
  color: #fff;
  box-shadow: 0 1px 0 rgba(255,255,255,.18) inset;
}
.column-header h2 { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: .005em; }

.count {
  margin-left: auto;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  background: rgba(0, 0, 0, .26);
  border-radius: 999px;
  min-width: 26px;
  padding: 1px 9px;
  text-align: center;
}

.column[data-status="In Progress"] .column-header { background: var(--col-active); }
.column[data-status="Blocked"]     .column-header { background: var(--col-blocked); }
.column[data-status="Done"]        .column-header { background: var(--col-done); }

.column-body {
  padding: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  flex: 1;
  background: var(--col-backlog-wash);
}

.column[data-status="In Progress"] .column-body { background: var(--col-active-wash); }
.column[data-status="Blocked"]     .column-body { background: var(--col-blocked-wash); }
.column[data-status="Done"]        .column-body { background: var(--col-done-wash); }
.column[data-status="Done"] .card { background: #fbfdfc; }
.column[data-status="Done"] .card-spine { background: #9bb3a8; }
.column[data-status="Done"] .sev { background: #4a6155; }
.column[data-status="Done"] .pill { background: var(--done-bg); color: #3c6354; }
.column[data-status="Done"] .pill-category { background: transparent; color: var(--quiet); }
.column[data-status="Done"] .card-title { color: #33413c; }

/* Drop target: the whole panel responds, no dashed-outline cliche */
.column.drop-target { border-color: var(--col-active); box-shadow: var(--lift-2); }
.column.drop-target .column-body { background: #dbe7fb; }

.column-empty {
  margin: 0;
  color: var(--quieter);
  font-size: 12px;
  padding: var(--space-4) var(--space-2);
}

/* ===========================================================================
   6. CARDS - flat, ruled, with a severity spine
   =========================================================================== */
.card {
  display: flex;
  background: var(--surface);
  border: 1px solid rgba(18, 32, 54, .10);
  border-radius: var(--r-card);
  box-shadow: var(--lift-1);
  cursor: grab;
}
.card:hover { box-shadow: var(--lift-2); border-color: rgba(18, 32, 54, .18); }
.card:active { cursor: grabbing; }
.card.dragging { opacity: .4; }

/* The spine: colour-codes severity. The P-code and the written priority
   below carry the same information, so colour is never doing this alone. */
.card-spine {
  flex: none;
  width: 6px;
  background: linear-gradient(180deg, #8e98a6 0%, var(--p4) 100%);
  border-radius: 1px 0 0 1px;
}
.prio-critical .card-spine { background: linear-gradient(180deg, #c8474d 0%, var(--p1) 100%); }
.prio-high     .card-spine { background: linear-gradient(180deg, #bd7a17 0%, var(--p2) 100%); }
.prio-medium   .card-spine { background: linear-gradient(180deg, #3d7bd9 0%, var(--p3) 100%); }
.prio-low      .card-spine { background: linear-gradient(180deg, #8e98a6 0%, var(--p4) 100%); }

.card-body { flex: 1; min-width: 0; padding: var(--space-3); }

.card-top { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }

.sev {
  flex: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--p4);
  color: #fff;
}
.prio-critical .sev { background: var(--p1); }
.prio-high     .sev { background: var(--p2); }
.prio-medium   .sev { background: var(--p3); }

.task-id { font-size: 11px; color: var(--quieter); letter-spacing: .01em; }

.overdue-flag {
  font-size: 11px;
  font-weight: 700;
  color: var(--p1);
  border-bottom: 2px solid var(--p1);
  padding-bottom: 1px;
}

.icon-btn {
  margin-left: auto;
  border: 1px solid transparent;
  background: transparent;
  color: var(--quieter);
  border-radius: var(--r-control);
  width: 22px; height: 22px;
  line-height: 1;
  font-size: 15px;
  cursor: pointer;
  flex: none;
  padding: 0;
}
.icon-btn:hover { background: var(--p1-bg); color: var(--p1); }

.card-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  margin-bottom: var(--space-2);
  max-width: 46ch;
}

.card-meta { display: grid; gap: 1px; font-size: 12px; color: var(--quiet); margin-bottom: var(--space-3); }
.card-meta .meta-label { color: var(--quieter); }
.card-notes { margin-top: var(--space-1); line-height: 1.45; max-width: 56ch; }

.tag-row { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-3); }

.pill {
  font-size: 11px;
  font-weight: 600;
  border-radius: 2px;
  padding: 2px 6px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.pill-critical { background: var(--p1-bg); color: var(--p1); }
.pill-high     { background: var(--p2-bg); color: var(--p2); }
.pill-medium   { background: var(--p3-bg); color: var(--p3); }
.pill-low      { background: var(--p4-bg); color: var(--p4); }
.pill-category { background: transparent; color: var(--quiet); border-color: var(--rule); }

.card-foot {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  border-top: 1px solid var(--rule-soft);
  padding-top: var(--space-2);
}
.card-foot label { font-size: 11px; color: var(--quieter); }

.move-select {
  border: 1px solid var(--rule);
  border-radius: var(--r-control);
  padding: 2px var(--space-1);
  font-size: 12px;
  background: var(--surface);
  color: var(--ink);
  max-width: 132px;
}
.move-select:hover { border-color: var(--quieter); }

/* Inline delete confirmation - never a native confirm() */
.confirm-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  border-top: 2px solid var(--p1);
  padding-top: var(--space-2);
  font-size: 12px;
  color: var(--p1);
  font-weight: 600;
}
.confirm-row .btn { padding: 2px var(--space-3); font-size: 12px; }

/* ===========================================================================
   7. BUTTONS
   =========================================================================== */
.btn {
  border: 1px solid var(--rule);
  border-radius: var(--r-control);
  padding: 7px var(--space-4);
  font-weight: 600;
  cursor: pointer;
  background: var(--surface);
  color: var(--ink);
}
.btn:hover { border-color: var(--quieter); }

.btn-primary { background: var(--p3); border-color: var(--p3); color: #fff; }
.btn-primary:hover { background: #164ea3; border-color: #164ea3; }
.btn-primary[disabled] { background: var(--quieter); border-color: var(--quieter); cursor: progress; }

.btn-ghost { background: #fff; border-color: #fff; color: var(--ink); }
.btn-ghost:hover { background: #e4ebf5; border-color: #e4ebf5; }

.btn-danger { background: var(--p1); border-color: var(--p1); color: #fff; }
.btn-danger:hover { background: #8a1f24; border-color: #8a1f24; }

/* ===========================================================================
   8. MODAL
   =========================================================================== */
dialog {
  border: none;
  border-radius: var(--r-panel);
  padding: 0;
  width: min(580px, 94vw);
  color: var(--ink);
  border-top: 3px solid var(--p3);
}
dialog::backdrop { background: rgba(14, 26, 43, .6); }

.modal-header {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--rule);
}
.modal-header h2 { font-size: 16px; margin-right: auto; }

.modal-body {
  padding: var(--space-5);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  max-height: 66vh;
  overflow-y: auto;
}
.modal-body .field { min-width: 0; }
.modal-body .field.span-2 { grid-column: 1 / -1; }
.modal-body .control { width: 100%; min-width: 0; }
.modal-body textarea { resize: vertical; min-height: 74px; line-height: 1.5; }

.field-hint { margin: 0; font-size: 11px; color: var(--quieter); }
.field-error { margin: 0; font-size: 12px; font-weight: 600; color: var(--p1); }
.control[aria-invalid="true"] { border-color: var(--p1); background: var(--p1-bg); }

.modal-foot {
  display: flex; justify-content: flex-end; gap: var(--space-2);
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid var(--rule);
  background: #f6f8fa;
}

.req { color: var(--p1); }

/* ===========================================================================
   9. TOASTS
   =========================================================================== */
.toasts {
  position: fixed;
  right: var(--space-5); bottom: var(--space-5);
  display: flex; flex-direction: column; gap: var(--space-2);
  z-index: 100;
  max-width: min(370px, 90vw);
}

.toast {
  border-radius: var(--r-control);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--quieter);
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  font-size: 13px;
  font-weight: 600;
}
.toast-success { border-left-color: var(--done); color: var(--done); }
.toast-warning { border-left-color: var(--p2); color: var(--p2); }

/* ===========================================================================
   10. RESPONSIVE
   =========================================================================== */
@media (max-width: 768px) {
  .app-header { padding: var(--space-4) var(--space-4) 0; }
  .board { grid-template-columns: 1fr; padding: var(--space-4); }
  .modal-body { grid-template-columns: 1fr; }
  .filters { padding: var(--space-4); }
  .filters-inner { flex-direction: column; align-items: stretch; }
  .control { min-width: 0; width: 100%; }
  .filter-status { margin: 0; }
  .datum { min-width: 0; flex: 1 1 42%; }
  .toasts { right: var(--space-3); left: var(--space-3); bottom: var(--space-3); max-width: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms; animation-iteration-count: 1; transition-duration: .01ms; }
}
</style>
</head>
<body>

<!-- ==========================================================================
     HEADER — neutral text wordmark, live summary strip, add-task action
     ========================================================================== -->
<header class="app-header">
  <div class="header-top">
    <div class="wordmark">
      <span class="wordmark-glyph" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="1" y="2" width="4" height="14" rx="1"></rect>
          <rect x="7" y="2" width="4" height="9"  rx="1"></rect>
          <rect x="13" y="2" width="4" height="12" rx="1"></rect>
        </svg>
      </span>
      <span class="wordmark-text">
        <strong>UOB IT PMO</strong>
        <span>Delivery control</span>
      </span>
    </div>
    <button type="button" class="btn btn-ghost" id="open-add-task">Add task</button>
  </div>

  <!-- Live counts, rebuilt by renderSummary() on every render -->
  <div class="summary" id="summary"></div>

  <p class="demo-note">
    Training environment, not an official UOB system. Nothing is saved: the board is held in
    memory, so refreshing restores the eight sample tasks.
  </p>
</header>

<!-- ==========================================================================
     FILTER BAR — pure client-side filtering over the in-memory array
     ========================================================================== -->
<section class="filters" aria-label="Filter tasks">
  <div class="filters-inner">
    <div class="field">
      <label for="filter-project">Project / Workstream</label>
      <select class="control" id="filter-project">
        <option value="">All projects</option>
      </select>
    </div>

    <div class="field">
      <label for="filter-assignee">Owner</label>
      <input class="control" id="filter-assignee" type="search" placeholder="Search by name" autocomplete="off">
    </div>

    <div class="field">
      <label for="filter-priority">Priority</label>
      <select class="control" id="filter-priority">
        <option value="">All priorities</option>
      </select>
    </div>

    <button type="button" class="btn" id="clear-filters">Clear filters</button>
    <p class="filter-status" id="filter-status"></p>
  </div>
</section>

<!-- ==========================================================================
     BOARD — four fixed columns, built by renderBoard()
     ========================================================================== -->
<main>
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<!-- ==========================================================================
     ADD TASK MODAL — native <dialog> gives focus trapping and Esc-to-close
     ========================================================================== -->
<dialog id="add-task-dialog" aria-labelledby="add-task-heading">
  <form id="add-task-form" novalidate>
    <div class="modal-header">
      <h2 id="add-task-heading">Add task</h2>
      <button type="button" class="icon-btn" id="close-dialog" aria-label="Close add task dialog">&times;</button>
    </div>

    <div class="modal-body">
      <div class="field span-2">
        <label for="f-title">Task title <span class="req" aria-hidden="true">*</span></label>
        <input class="control" id="f-title" name="title" type="text" maxlength="80"
               aria-describedby="e-title" autocomplete="off">
        <p class="field-error" id="e-title"></p>
      </div>

      <div class="field span-2">
        <label for="f-description">Description</label>
        <textarea class="control" id="f-description" name="description" maxlength="500"
                  aria-describedby="h-description e-description"></textarea>
        <p class="field-hint" id="h-description">Optional &mdash; up to 500 characters.</p>
        <p class="field-error" id="e-description"></p>
      </div>

      <div class="field">
        <label for="f-project">Project / Workstream</label>
        <select class="control" id="f-project" name="project" aria-describedby="e-project"></select>
        <p class="field-error" id="e-project"></p>
      </div>

      <div class="field">
        <label for="f-category">Category</label>
        <select class="control" id="f-category" name="category" aria-describedby="e-category"></select>

      <div class="field">
        <label for="f-assignee">Owner <span class="req" aria-hidden="true">*</span></label>
        <input class="control" id="f-assignee" name="assignee" type="text" maxlength="60"
               aria-describedby="e-assignee" autocomplete="off">
        <p class="field-error" id="e-assignee"></p>
      </div>

      <div class="field">
        <label for="f-priority">Priority</label>
        <select class="control" id="f-priority" name="priority" aria-describedby="e-priority"></select>
        <p class="field-error" id="e-priority"></p>
      </div>

      <div class="field">
        <label for="f-dueDate">Due date <span class="req" aria-hidden="true">*</span></label>
        <input class="control" id="f-dueDate" name="dueDate" type="date" aria-describedby="e-dueDate">
        <p class="field-error" id="e-dueDate"></p>
      </div>

      <div class="field">
        <label for="f-status">Status</label>
        <select class="control" id="f-status" name="status" aria-describedby="e-status"></select>
        <p class="field-error" id="e-status"></p>

    <div class="modal-foot">
      <button type="button" class="btn" id="cancel-dialog">Cancel</button>
      <button type="submit" class="btn btn-primary" id="submit-task">Add task</button>
    </div>
  </form>
</dialog>

<!-- Transient notifications -->
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

<script>
"use strict";

/* ===========================================================================
   1. CONFIG
   ---------------------------------------------------------------------------
   FORMSUBMIT ACTIVATION: FormSubmit requires a ONE-TIME activation per address.
   The very first submission sent to a new address triggers a confirmation email
   to that address; NOTHING is delivered until the link in that email is clicked.
   Swap the address in FORMSUBMIT_ENDPOINT below (this is the only place it
   appears), submit the form once, then click the confirmation link.
   =========================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];

// Empty states point at what to do next rather than stating the obvious.
const EMPTY_COPY = {
  "Backlog":     "Nothing queued. Add a task to start one.",
  "In Progress": "Nothing in flight.",
  "Blocked":     "Nothing blocked.",
  "Done":        "Nothing closed yet."
};

const STATUS_HINTS = {
  "Backlog":     "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked":     "Waiting on a dependency, vendor or approval",
  "Done":        "Completed / closed"
};

const PROJECTS = [
  "Core Banking Upgrade",
  "Digital Channels",
  "Cybersecurity Uplift",
  "Data & Analytics",
  "Infrastructure & Cloud",
  "Vendor Management"
];

const CATEGORIES = [
  "Application Development",
  "Infrastructure",
  "Cybersecurity",
  "Data",
  "Compliance",
  "Vendor"
];

const PRIORITIES = ["Critical", "High", "Medium", "Low"];

// Severity codes: standard IT change-management vernacular. Shown on every
// card alongside the written priority, so the spine colour is never the only
// thing carrying severity.
const PRIORITY_CODE = { Critical: "P1", High: "P2", Medium: "P3", Low: "P4" };

const ID_PREFIX = "UOB-ITPM-";
const TOAST_MS = 4500;

/* ===========================================================================
   2. STATE — the single source of truth. In memory only: no localStorage,
   sessionStorage, IndexedDB or cookies are used anywhere in this file.
   =========================================================================== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  nextId: 1,
  pendingDelete: null   // task id currently showing the inline Delete? Yes/No row
};

/* ===========================================================================
   3. UTILITIES
   =========================================================================== */

/** Escape every user-supplied string before it is inserted into HTML. */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/** Today as a local-midnight YYYY-MM-DD string (date inputs use this format). */
function todayISO() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

/** A YYYY-MM-DD string offset from today by the given number of days. */
function dateOffset(days) {
  const now = new Date();
  now.setDate(now.getDate() + days);
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

/** Human-friendly due date, e.g. "16 Sep 2026". */
function formatDate(iso) {
  const parts = String(iso).split("-");
  if (parts.length !== 3) return iso;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const monthIndex = Number(parts[1]) - 1;
  if (!months[monthIndex]) return iso;
  return Number(parts[2]) + " " + months[monthIndex] + " " + parts[0];
}

/** Overdue = due date in the past AND not yet Done. ISO strings sort lexically. */
function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

/** Next zero-padded task ID, e.g. UOB-ITPM-0009. */
function nextTaskId() {
  const id = ID_PREFIX + String(state.nextId).padStart(4, "0");
  state.nextId += 1;
  return id;
}

/** Fill a <select> from an array of option values. */
function fillSelect(select, values, placeholder) {
  const options = [];
  if (placeholder) options.push('<option value="">' + escapeHtml(placeholder) + "</option>");
  values.forEach(function (value) {
    options.push('<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + "</option>");
  });
  select.innerHTML = options.join("");
}

/* ===========================================================================
   4. FILTERING — pure, client-side, over the in-memory array
   =========================================================================== */
function applyFilters() {
  const f = state.filters;
  const assignee = f.assignee.trim().toLowerCase();

  return state.tasks.filter(function (task) {
    if (f.project && task.project !== f.project) return false;
    if (f.priority && task.priority !== f.priority) return false;
    if (assignee && task.assignee.toLowerCase().indexOf(assignee) === -1) return false;
    return true;
  });
}

function readFiltersFromInputs() {
  state.filters.project  = document.getElementById("filter-project").value;
  state.filters.assignee = document.getElementById("filter-assignee").value;
  state.filters.priority = document.getElementById("filter-priority").value;
  state.pendingDelete = null;   // a re-filter cancels any open delete confirmation
  renderBoard();
}

function clearFilters() {
  document.getElementById("filter-project").value = "";
  document.getElementById("filter-assignee").value = "";
  document.getElementById("filter-priority").value = "";
  readFiltersFromInputs();
}

/* ===========================================================================
   5. RENDERING — everything on the board is drawn from state, here and only
   here. No code outside renderBoard()/renderCard() mutates card contents.
   =========================================================================== */

/** Build one card's HTML. All interpolated user text goes through escapeHtml(). */
function renderCard(task) {
  const id = escapeHtml(task.id);
  const priorityKey = task.priority.toLowerCase();
  const overdue = isOverdue(task);

  const overdueFlag = overdue
    ? '<span class="overdue-flag">Overdue</span>'
    : "";

  const moveOptions = STATUSES.map(function (status) {
    const selected = status === task.status ? " selected" : "";
    return '<option value="' + escapeHtml(status) + '"' + selected + ">" +
           escapeHtml(status) + "</option>";
  }).join("");

  // Inline delete confirmation replaces the footer controls — never confirm().
  const footer = state.pendingDelete === task.id
    ? '<div class="confirm-row">' +
        "<span>Delete " + id + "?</span>" +
        '<button type="button" class="btn btn-danger" data-action="delete-confirm" data-id="' + id + '">Yes</button>' +
        '<button type="button" class="btn" data-action="delete-cancel" data-id="' + id + '">No</button>' +
      "</div>"
    : '<div class="card-foot">' +
        '<label for="move-' + id + '">Move</label>' +
        '<select class="move-select" id="move-' + id + '" data-action="move" data-id="' + id + '" ' +
          'aria-label="Move task ' + id + ' to another column">' + moveOptions + "</select>" +
      "</div>";

  const description = task.description
    ? '<span class="card-notes">' + escapeHtml(task.description) + "</span>"
    : "";

  const code = PRIORITY_CODE[task.priority] || "P4";

  return '<article class="card prio-' + escapeHtml(priorityKey) + '" draggable="true" ' +
           'data-id="' + id + '" aria-label="Task ' + id + ': ' + escapeHtml(task.title) + '">' +
    '<span class="card-spine" aria-hidden="true"></span>' +
    '<div class="card-body">' +
      '<div class="card-top">' +
        '<span class="sev" aria-label="Severity ' + escapeHtml(code) + ', ' +
          escapeHtml(task.priority) + ' priority">' + escapeHtml(code) + "</span>" +
        '<span class="task-id">' + id + "</span>" +
        overdueFlag +
        '<button type="button" class="icon-btn" data-action="delete-request" data-id="' + id + '" ' +
          'aria-label="Delete task ' + id + '">&times;</button>' +
      "</div>" +
      '<h3 class="card-title">' + escapeHtml(task.title) + "</h3>" +
      '<div class="card-meta">' +
        '<span><span class="meta-label">Project</span> ' + escapeHtml(task.project) + "</span>" +
        '<span><span class="meta-label">Owner</span> ' + escapeHtml(task.assignee) + "</span>" +
        '<span class="card-due"><span class="meta-label">Due</span> ' +
          escapeHtml(formatDate(task.dueDate)) + "</span>" +
        description +
      "</div>" +
      '<div class="tag-row">' +
        '<span class="pill pill-' + escapeHtml(priorityKey) + '">' + escapeHtml(task.priority) + "</span>" +
        '<span class="pill pill-category">' + escapeHtml(task.category) + "</span>" +
      "</div>" +
      footer +
    "</div>" +
  "</article>";
}

/** Rebuild all four columns and their count badges from the filtered tasks. */
function renderBoard() {
  const visible = applyFilters();
  const board = document.getElementById("board");

  board.innerHTML = STATUSES.map(function (status) {
    const inColumn = visible.filter(function (task) { return task.status === status; });

    const cards = inColumn.length
      ? inColumn.map(renderCard).join("")
      : '<p class="column-empty">' + escapeHtml(EMPTY_COPY[status]) + "</p>";

    return '<section class="column" data-status="' + escapeHtml(status) + '" ' +
             'aria-label="' + escapeHtml(status) + ' column">' +
      '<div class="column-header">' +
        "<h2>" + escapeHtml(status) + "</h2>" +
        '<span class="count" aria-label="' + inColumn.length + ' tasks in ' + escapeHtml(status) + '">' +
          inColumn.length + "</span>" +
      "</div>" +
      '<p class="visually-hidden">' + escapeHtml(STATUS_HINTS[status]) + "</p>" +
      '<div class="column-body" data-status="' + escapeHtml(status) + '">' + cards + "</div>" +
    "</section>";
  }).join("");

  renderSummary(state.tasks);
  renderFilterStatus(state.tasks, visible);
}

/** Live totals in the header: total, per-status, overdue. */
function renderSummary(allTasks) {
  const overdue = allTasks.filter(isOverdue).length;

  const items = ['<span class="datum datum-total"><b>' + allTasks.length + "</b> tasks</span>"];

  STATUSES.forEach(function (status) {
    const count = allTasks.filter(function (task) { return task.status === status; }).length;
    const done = status === "Done" ? " datum-done" : "";
    items.push('<span class="datum' + done + '"><b>' + count + "</b> " +
               escapeHtml(status.toLowerCase()) + "</span>");
  });

  // Overdue is the one figure this design raises its voice for.
  items.push('<span class="datum ' + (overdue ? "datum-alert" : "datum-clear") + '"><b>' +
             overdue + "</b> overdue</span>");

  // The summary always reports the whole board, not the filtered view.
  document.getElementById("summary").innerHTML = items.join("");
}

function renderFilterStatus(allTasks, visibleTasks) {
  const filtered = visibleTasks.length !== allTasks.length;
  document.getElementById("filter-status").textContent = filtered
    ? "Showing " + visibleTasks.length + " of " + allTasks.length + " tasks"
    : "Showing all " + allTasks.length + " tasks";
}

/* ===========================================================================
   6. TOASTS
   =========================================================================== */
function showToast(message, type) {
  const toast = document.createElement("div");
  toast.className = "toast toast-" + (type || "success");
  toast.textContent = message;

  const region = document.getElementById("toasts");
  region.appendChild(toast);

  window.setTimeout(function () {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, TOAST_MS);
}

/* ===========================================================================
   7. ACTIONS — the only functions that mutate state.tasks
   =========================================================================== */
function addTask(data) {
  const task = {
    id: nextTaskId(),
    title: data.title,
    description: data.description,
    project: data.project,
    category: data.category,
    assignee: data.assignee,
    priority: data.priority,
    dueDate: data.dueDate,
    status: data.status
  };

  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, status) {
  const task = state.tasks.find(function (item) { return item.id === id; });
  if (!task || task.status === status) return;

  task.status = status;
  state.pendingDelete = null;
  renderBoard();
}

function deleteTask(id) {
  const index = state.tasks.findIndex(function (task) { return task.id === id; });
  if (index === -1) return;

  state.tasks.splice(index, 1);
  state.pendingDelete = null;
  renderBoard();
  showToast("Deleted " + id + ".", "success");
}

/* ===========================================================================
   8. CARD INTERACTIONS — delegated from the board so re-renders keep working
   =========================================================================== */
function handleBoardClick(event) {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const action = button.getAttribute("data-action");
  const id = button.getAttribute("data-id");

  if (action === "delete-request") {
    state.pendingDelete = id;
    renderBoard();
  } else if (action === "delete-cancel") {
    state.pendingDelete = null;
    renderBoard();
  } else if (action === "delete-confirm") {
    deleteTask(id);
  }
}

function handleBoardChange(event) {
  const select = event.target.closest('select[data-action="move"]');
  if (!select) return;
  moveTask(select.getAttribute("data-id"), select.value);
}

/* ===========================================================================
   9. DRAG AND DROP — native HTML5 API, with the Move control as the
   keyboard-accessible equivalent
   =========================================================================== */
let draggedId = null;

function handleDragStart(event) {
  const card = event.target.closest(".card");
  if (!card) return;

  draggedId = card.getAttribute("data-id");
  card.classList.add("dragging");
  event.dataTransfer.effectAllowed = "move";
  event.dataTransfer.setData("text/plain", draggedId);
}

function handleDragEnd(event) {
  const card = event.target.closest(".card");
  if (card) card.classList.remove("dragging");
  draggedId = null;
  clearDropTargets();
}

function handleDragOver(event) {
  const column = event.target.closest(".column");
  if (!column) return;

  event.preventDefault();               // required to allow a drop
  event.dataTransfer.dropEffect = "move";
  highlightColumn(column);
}

function handleDragLeave(event) {
  const column = event.target.closest(".column");
  if (!column) return;

  // Ignore dragleave fired while moving between the column's own children.
  if (event.relatedTarget && column.contains(event.relatedTarget)) return;
  column.classList.remove("drop-target");
}

function handleDrop(event) {
  const column = event.target.closest(".column");
  if (!column) return;

  event.preventDefault();
  clearDropTargets();

  const id = event.dataTransfer.getData("text/plain") || draggedId;
  draggedId = null;
  if (id) moveTask(id, column.getAttribute("data-status"));
}

function highlightColumn(column) {
  clearDropTargets();
  column.classList.add("drop-target");
}

function clearDropTargets() {
  const columns = document.querySelectorAll(".column.drop-target");
  Array.prototype.forEach.call(columns, function (column) {
    column.classList.remove("drop-target");
  });
}

/* ===========================================================================
   10. FORM — validation, optimistic add, network notification
   =========================================================================== */
function readForm() {
  return {
    title:       document.getElementById("f-title").value.trim(),
    description: document.getElementById("f-description").value.trim(),
    project:     document.getElementById("f-project").value,
    category:    document.getElementById("f-category").value,
    assignee:    document.getElementById("f-assignee").value.trim(),
    priority:    document.getElementById("f-priority").value,
    dueDate:     document.getElementById("f-dueDate").value,
    status:      document.getElementById("f-status").value
  };
}

/** Client-side validation. Returns { ok, errors } — never uses alert(). */
function validateForm(fields) {
  const errors = {};

  if (!fields.title) {
    errors.title = "Task title is required.";
  } else if (fields.title.length > 80) {
    errors.title = "Keep the title to 80 characters or fewer.";
  }

  if (fields.description.length > 500) {
    errors.description = "Keep the description to 500 characters or fewer.";
  }

  if (PROJECTS.indexOf(fields.project) === -1) {
    errors.project = "Choose a project or workstream.";
  }

  if (CATEGORIES.indexOf(fields.category) === -1) {
    errors.category = "Choose a category.";
  }

  if (!fields.assignee) {
    errors.assignee = "Assignee is required.";
  }

  if (PRIORITIES.indexOf(fields.priority) === -1) {
    errors.priority = "Choose a priority.";
  }

  if (!fields.dueDate) {
    errors.dueDate = "Due date is required.";
  } else if (fields.dueDate < todayISO()) {
    errors.dueDate = "Due date cannot be in the past.";
  }

  if (STATUSES.indexOf(fields.status) === -1) {
    errors.status = "Choose a status.";
  }

  return { ok: Object.keys(errors).length === 0, errors: errors };
}

/** Paint inline error text under each invalid field. */
function showFieldErrors(errors) {
  const names = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];

  names.forEach(function (name) {
    const message = errors[name] || "";
    document.getElementById("e-" + name).textContent = message;

    const input = document.getElementById("f-" + name);
    if (message) {
      input.setAttribute("aria-invalid", "true");
    } else {
      input.removeAttribute("aria-invalid");
    }
  });

  // Move focus to the first field in error so keyboard users land on it.
  const firstInvalid = names.find(function (name) { return errors[name]; });
  if (firstInvalid) document.getElementById("f-" + firstInvalid).focus();
}

function clearFieldErrors() {
  showFieldErrors({});
}

function setSubmitting(isSubmitting) {
  const button = document.getElementById("submit-task");
  button.disabled = isSubmitting;
  button.textContent = isSubmitting ? "Sending…" : "Add task";
}

function handleSubmit(event) {
  event.preventDefault();

  const fields = readForm();
  const result = validateForm(fields);

  if (!result.ok) {
    showFieldErrors(result.errors);
    return;
  }

  clearFieldErrors();

  // Optimistic UI: the card is on the board before the network call starts.
  const task = addTask(fields);
  showToast("Added " + task.id + " to " + task.status + ".", "success");

  setSubmitting(true);
  notifyNewTask(task)
    .catch(function (error) {
      // A FormSubmit failure must never break the board.
      console.warn("FormSubmit notification failed:", error);
      showToast("Card added locally — email notification failed", "warning");
    })
    .then(function () {
      setSubmitting(false);
      closeDialog();
      resetForm();
    });
}

function resetForm() {
  document.getElementById("add-task-form").reset();
  document.getElementById("f-priority").value = "Medium";
  document.getElementById("f-status").value = "Backlog";
  document.getElementById("f-dueDate").setAttribute("min", todayISO());
  clearFieldErrors();
}

function openDialog() {
  resetForm();
  document.getElementById("add-task-dialog").showModal();
  document.getElementById("f-title").focus();
}

function closeDialog() {
  const dialog = document.getElementById("add-task-dialog");
  if (dialog.open) dialog.close();
}

/* ===========================================================================
   11. NETWORK — FormSubmit AJAX endpoint. The user's email address is never
   sent anywhere except this endpoint.
   =========================================================================== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString(),
    }),
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ===========================================================================
   13. INIT — wire up selects, listeners, seed data, first render
   =========================================================================== */
function initSelects() {
  fillSelect(document.getElementById("filter-project"), PROJECTS, "All projects");
  fillSelect(document.getElementById("filter-priority"), PRIORITIES, "All priorities");

  fillSelect(document.getElementById("f-project"), PROJECTS);
  fillSelect(document.getElementById("f-category"), CATEGORIES);
  fillSelect(document.getElementById("f-priority"), PRIORITIES);
  fillSelect(document.getElementById("f-status"), STATUSES);
}

function initListeners() {
  const board = document.getElementById("board");

  board.addEventListener("click", handleBoardClick);
  board.addEventListener("change", handleBoardChange);
  board.addEventListener("dragstart", handleDragStart);
  board.addEventListener("dragend", handleDragEnd);
  board.addEventListener("dragover", handleDragOver);
  board.addEventListener("dragleave", handleDragLeave);
  board.addEventListener("drop", handleDrop);

  document.getElementById("filter-project").addEventListener("change", readFiltersFromInputs);
  document.getElementById("filter-priority").addEventListener("change", readFiltersFromInputs);
  document.getElementById("filter-assignee").addEventListener("input", readFiltersFromInputs);
  document.getElementById("clear-filters").addEventListener("click", clearFilters);

  document.getElementById("open-add-task").addEventListener("click", openDialog);
  document.getElementById("close-dialog").addEventListener("click", closeDialog);
  document.getElementById("cancel-dialog").addEventListener("click", closeDialog);
  document.getElementById("add-task-form").addEventListener("submit", handleSubmit);
}

function init() {
  initSelects();
  initListeners();
  seedTasks();
  resetForm();
  renderBoard();
}

init();
</script>
</body>
</html>
